name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Create WebView Project
        run: |
          npm install -g cordova
          cordova create myapp com.game.flags "Simulator Flag"
          cd myapp
          cordova platform add android
          rm -rf www/*
          cp ../index.html www/index.html
          echo '<widget id="com.game.flags" version="1.0.0" xmlns="http://www.w3.org/ns/widgets"><name>Simulator Flag</name><content src="index.html" /><preference name="Orientation" value="portrait" /><preference name="Fullscreen" value="true" /></widget>' > config.xml
          cordova build android --release

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: Clean-Game-APK
          path: myapp/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk

